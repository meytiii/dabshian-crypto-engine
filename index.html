<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dabshian Crypto Engine</title>
    <link rel="icon" type="image/png" href="favicon.png">
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/crypto-js/4.1.1/crypto-js.min.js"></script>
</head>
<body>
    <div class="background-animation"></div>
    <div class="container glass-panel">
        <h2 class="title"><i class="fa-solid fa-shield-halved"></i> Dabshian Crypto Engine</h2>
        
        <div class="input-group">
            <div class="label-row">
                <label>Input Data <span id="charCount" class="char-count">0 chars</span></label>
                <div class="btn-group-sm">
                    <button id="btnPaste" class="icon-btn" title="Paste from clipboard"><i class="fa-solid fa-paste"></i> Paste</button>
                    <button id="btnClear" class="icon-btn" title="Clear fields"><i class="fa-solid fa-trash"></i> Clear</button>
                </div>
            </div>
            <textarea id="inputText" placeholder="Initialize text payload..."></textarea>
        </div>

        <div class="controls">
            <div class="input-group">
                <label><i class="fa-solid fa-microchip"></i> Algorithm</label>
                <div class="select-wrapper">
                    <select id="algorithm">
                        <option value="AES">AES-256</option>
                        <option value="DES">DES</option>
                        <option value="TripleDES">Triple DES</option>
                        <option value="Rabbit">Rabbit</option>
                        <option value="RC4">RC4</option>
                    </select>
                </div>
            </div>
            <div class="input-group">
                <label><i class="fa-solid fa-key"></i> Secret Key</label>
                <div class="input-wrapper">
                    <input type="password" id="secretKey" placeholder="Enter cipher key">
                    <button id="toggleKey" class="toggle-btn" type="button" title="Toggle key visibility"><i class="fa-solid fa-eye"></i></button>
                </div>
            </div>
        </div>

        <div class="actions">
            <button id="btnEncrypt" class="action-btn encrypt-btn"><i class="fa-solid fa-lock"></i> Encrypt</button>
            <button id="btnDecrypt" class="action-btn decrypt-btn"><i class="fa-solid fa-lock-open"></i> Decrypt</button>
        </div>

        <div class="input-group">
            <div class="label-row">
                <label>Output Data</label>
                <div class="btn-group-sm">
                    <button id="btnSwap" class="icon-btn" title="Move output to input"><i class="fa-solid fa-arrow-up"></i> Move to Input</button>
                    <button id="btnCopy" class="icon-btn" title="Copy to clipboard"><i class="fa-solid fa-copy"></i> Copy</button>
                </div>
            </div>
            <textarea id="outputText" readonly placeholder="Awaiting execution..."></textarea>
        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
